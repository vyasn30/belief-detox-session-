<!doctype html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>દોષ પાછળ છુપાયેલી ખોટી માન્યતાઓ – નવો સર્વે</title>
<link rel="stylesheet" href="styles.css">
<style>
  .scn-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .scn-num {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    border: 1px solid var(--accent-soft);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 10px;
  }
  .scn-text {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.7;
    margin: 0 0 10px;
    padding: 12px 14px;
    background: var(--accent-soft);
    border-radius: 10px;
  }
  .prev-answer {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    margin: 0 0 16px;
    font-style: italic;
  }
  .prev-label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 700;
    font-style: normal;
    margin-bottom: 3px;
  }

  .belief-prompt {
    font-weight: 600;
    font-size: 1rem;
    margin: 0 0 10px;
  }
  .belief-textarea {
    width: 100%;
    min-height: 80px;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }

  .belief-submit-btn {
    margin-top: 12px;
    padding: 10px 28px;
    font-size: 0.92rem;
  }
  .belief-submit-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .hint-row { margin-top: 14px; }
  .hint-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .hint-btn:hover { border-color: var(--accent); color: var(--accent); }
  .hint-box {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    border-left: 3px solid var(--border);
    font-size: 0.86rem;
    color: var(--muted);
  }
  .hint-box.show { display: block; }
  .hint-box .hint-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .hint-box ul { margin: 0; padding-left: 18px; }
  .hint-box li { margin-bottom: 4px; }

  .status-block {
    display: none;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .status-block.show { display: block; }
  .status-prompt {
    font-weight: 600;
    font-size: 0.98rem;
    margin: 0 0 12px;
  }
  .duration-input {
    display: none;
    margin-top: 8px;
    margin-left: 28px;
    width: calc(100% - 28px);
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.88rem;
  }
  .duration-input.show { display: block; }

  .pager-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }
  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
  }
  .back-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .next-section-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .report-card-row {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    text-align: center;
  }
  .report-card-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .report-card-btn:hover { background: var(--accent-soft); }
</style>
</head>
<body>
<button type="button" id="dev-fill-btn" class="dev-fill-btn">🛠 Fill random (dev)</button>
<div class="wrap">

  <header class="top">
    <h1>દોષ પાછળ છુપાયેલી ખોટી માન્યતાઓ</h1>
  </header>

  <div class="instructions">
    <p>દરેક પ્રસંગમાં, તમે પહેલાંના વિભાગમાં જે પસંદ કર્યું હતું એ ફરી બતાવ્યું છે. એ પસંદગી પાછળ કઈ માન્યતા કામ કરી રહી હતી, એ તમારા પોતાના શબ્દોમાં લખો — વિકલ્પોમાંથી પસંદ કરવાનું નથી.</p>
    <p>લખવામાં મુશ્કેલી પડે તો "Hint જોઈએ છે?" પર ક્લિક કરો.</p>
  </div>

  <div class="progress-bar">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label" id="progress-label">0 / 6 પ્રસંગ પૂરા</div>
  </div>

  <div id="scenario-pager"></div>

</div>

<script>
const SCENARIOS = [
  {
    id: "w1",
    text: "રાત્રે મોડે સુધી કામ ચાલ્યું. ઊંઘ નથી આવતી. ફોન હાથમાં છે. ઘરમાં/રૂમમાં બીજું કોઈ નથી.",
    hints: [
      "કોઈને ખબર તો નહીં જ પડે.",
      "થોડી વાર જોઈ લઉં, કંઈ નહીં થાય.",
      "આ તો મન કરે છે, હું ક્યાં કરું છું."
    ]
  },
  {
    id: "w2",
    text: "કોઈકે અપમાન કર્યું. એ જ સાંજે self negativity થાય છે, mood ખરાબ છે, કંઈક \"feel better\" કરવું છે.",
    hints: [
      "આજે એટલો સ્ટ્રેસમાં/દુઃખી છું કે આ તો હકદાર છું.",
      "આ સ્ટ્રેસ દૂર કરવાનો સૌથી સહેલો રસ્તો આ જ છે.",
      "મારી કોઈ કિંમત નથી, તો આનાથી શું ફરક પડે છે."
    ]
  },
  {
    id: "w3",
    text: "2 અઠવાડિયાથી સાફ ચાલતું હતું. આજે friend ના group chat માં કોઈએ suggestive reel/meme share કર્યું.",
    hints: [
      "બીજા બધા પણ આવું જ કરે છે.",
      "હું ગમે ત્યારે છોડી શકું છું, મારો કાબૂ છે.",
      "આટલા દિવસ સાફ રહ્યો, હવે થોડું ચાલે."
    ]
  },
  {
    id: "w4",
    text: "Stress માંથી break લેવા ફોન ખોલ્યો. \"ફક્ત 5 મિનિટ જોઈ લઉં\" એમ વિચાર્યું.",
    hints: [
      "આ તો મન કરે છે, હું ક્યાં કરું છું.",
      "પછી પ્રતિક્રમણ કરી લઈશ.",
      "થોડું જ છે, આનાથી કંઈ મોટું નુકસાન નહીં થાય."
    ]
  },
  {
    id: "w5",
    text: "સવારે ઊઠીને ખૂબ પસ્તાવો થયો. કોઈ નજીકનું પૂછે, \"કેમ ચાલે છે આજકાલ?\" — તમે શું કહેશો?",
    prompt: "જવાબ આપતી વખતે (કે ટાળતી વખતે), મનમાં કઈ માન્યતા કામ કરી રહી હતી?",
    hints: [
      "સાચું કહીશ તો એ મારા વિશે શું વિચારશે?",
      "આ કોઈના કામનું નથી.",
      "આ એટલું મોટું નથી કે કહેવા જેવું હોય."
    ]
  },
  {
    id: "w6",
    text: "રાત્રે ઘરના, સાધક મિત્રો, roommate કે co-worker/co-સેવાર્થી સાથે ઝઘડો થયો. ગુસ્સો છે, કંઈક release જોઈએ છે.",
    hints: [
      "આ સ્ટ્રેસ દૂર કરવાનો સૌથી સહેલો રસ્તો આ જ છે.",
      "આ તો મન કરે છે, હું ક્યાં કરું છું.",
      "આણે મને આટલું દુઃખ આપ્યું, તો મને પણ કંઈક જોઈએ."
    ]
  }
];

const DEFAULT_PROMPT = "આ પસંદગી પાછળ, મનમાં કઈ માન્યતા કામ કરી રહી હતી?";

const STATUS_OPTIONS = [
  "આ માન્યતા સામે મેં હજુ કંઈ કામ કર્યું નથી.",
  "આ માન્યતાને તોડવાની ચાવી હજુ મળી નથી.",
  "સત્સંગ/વાંચનથી ચાવી મળી છે, પણ એના પર એટલું કામ કરી શક્યો નથી.",
  "ચાવી મળી છે અને કામ કરું છું, પણ માન્યતા તૂટતી નથી.",
  "કામ કરું છું અને તૂટે છે પણ — અમુક સમય સારું જાય છે, પછી પાછી એ જ તકલીફ આવે છે.",
  "આ માન્યતા મને એટલી હેરાન કરતી નથી."
];
const DURATION_OPTION_INDEX = 4;

let PREV_ANSWERS = [];
try {
  PREV_ANSWERS = JSON.parse(sessionStorage.getItem("section2Answers")) || [];
} catch (e) {
  PREV_ANSWERS = [];
}

let CUSTOM_PRASANGS = [];
try {
  CUSTOM_PRASANGS = JSON.parse(sessionStorage.getItem("section2CustomPrasangs")) || [];
} catch (e) {
  CUSTOM_PRASANGS = [];
}

const ALL_SCENARIOS = [
  ...SCENARIOS.map((s, i) => ({ ...s, prevAnswer: PREV_ANSWERS[i] || null, custom: false })),
  ...CUSTOM_PRASANGS.map((p, i) => ({
    id: `custom-${i}`,
    text: p.text,
    prevAnswer: p.answer,
    hints: [],
    custom: true
  }))
];

const responses = ALL_SCENARIOS.map(s => ({ id: s.id, scenarioText: s.text, belief: "", statusIdx: null, duration: "", submitted: false }));
let currentIndex = 0;

const pager = document.getElementById("scenario-pager");

function isComplete(r) {
  return r.belief.trim().length > 0 && r.statusIdx !== null;
}

function renderScenario() {
  const s = ALL_SCENARIOS[currentIndex];
  const r = responses[currentIndex];
  pager.innerHTML = "";

  const card = document.createElement("div");
  card.className = "scn-card";

  const num = document.createElement("div");
  num.className = "scn-num";
  num.textContent = `પ્રસંગ ${currentIndex + 1} / ${ALL_SCENARIOS.length}` + (s.custom ? " (તમારો પોતાનો પ્રસંગ)" : "");
  card.appendChild(num);

  const text = document.createElement("p");
  text.className = "scn-text";
  text.textContent = s.text;
  card.appendChild(text);

  const prevAnswer = s.prevAnswer;
  if (prevAnswer) {
    const echo = document.createElement("div");
    echo.className = "prev-answer";
    echo.innerHTML = `<span class="prev-label">તમે પહેલાંના વિભાગમાં કહ્યું હતું:</span> "${prevAnswer}"`;
    card.appendChild(echo);
  }

  const prompt = document.createElement("p");
  prompt.className = "belief-prompt";
  prompt.textContent = s.prompt || DEFAULT_PROMPT;
  card.appendChild(prompt);

  const textarea = document.createElement("textarea");
  textarea.className = "belief-textarea";
  textarea.placeholder = "તમારા પોતાના શબ્દોમાં લખો...";
  textarea.value = r.belief;
  textarea.addEventListener("input", () => {
    r.belief = textarea.value;
    submitBtn.disabled = r.belief.trim().length === 0;
    saveToSession();
    updateNav();
  });
  textarea.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!submitBtn.disabled) submitBtn.click();
    }
  });
  card.appendChild(textarea);

  const submitBtn = document.createElement("button");
  submitBtn.type = "button";
  submitBtn.className = "submit-btn belief-submit-btn";
  submitBtn.textContent = "Submit કરો";
  submitBtn.disabled = r.belief.trim().length === 0;
  submitBtn.addEventListener("click", () => {
    if (r.belief.trim().length === 0) return;
    r.submitted = true;
    statusBlock.classList.add("show");
    saveToSession();
    updateNav();
  });
  card.appendChild(submitBtn);

  if (s.hints && s.hints.length > 0) {
    const hintRow = document.createElement("div");
    hintRow.className = "hint-row";
    const hintBtn = document.createElement("button");
    hintBtn.type = "button";
    hintBtn.className = "hint-btn";
    hintBtn.textContent = "Hint જોઈએ છે?";
    const hintBox = document.createElement("div");
    hintBox.className = "hint-box";
    const hintTitle = document.createElement("div");
    hintTitle.className = "hint-title";
    hintTitle.textContent = "દા.ત.";
    hintBox.appendChild(hintTitle);
    const hintList = document.createElement("ul");
    s.hints.forEach(h => {
      const li = document.createElement("li");
      li.textContent = h;
      hintList.appendChild(li);
    });
    hintBox.appendChild(hintList);
    hintBtn.addEventListener("click", () => hintBox.classList.toggle("show"));
    hintRow.appendChild(hintBtn);
    hintRow.appendChild(hintBox);
    card.appendChild(hintRow);
  }

  const statusBlock = document.createElement("div");
  statusBlock.className = "status-block" + (r.submitted ? " show" : "");
  const statusPrompt = document.createElement("p");
  statusPrompt.className = "status-prompt";
  statusPrompt.textContent = "આ માન્યતા સાથે તમે અત્યારે ક્યાં છો?";
  statusBlock.appendChild(statusPrompt);

  const statusOpts = document.createElement("div");
  statusOpts.className = "options";
  STATUS_OPTIONS.forEach((label, oi) => {
    const optLabel = document.createElement("label");
    optLabel.className = "option";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = `status-${s.id}`;
    input.value = oi;
    input.checked = r.statusIdx === oi;
    input.addEventListener("change", () => {
      r.statusIdx = oi;
      [...statusOpts.children].forEach(o => o.classList.remove("selected"));
      optLabel.classList.add("selected");
      durationInput.classList.toggle("show", oi === DURATION_OPTION_INDEX);
      saveToSession();
      updateNav();
    });
    optLabel.appendChild(input);
    const span = document.createElement("span");
    span.textContent = label;
    optLabel.appendChild(span);
    if (r.statusIdx === oi) optLabel.classList.add("selected");
    statusOpts.appendChild(optLabel);
  });
  statusBlock.appendChild(statusOpts);

  const durationInput = document.createElement("input");
  durationInput.type = "text";
  durationInput.className = "duration-input" + (r.statusIdx === DURATION_OPTION_INDEX ? " show" : "");
  durationInput.placeholder = "કેટલો સમય સારું જાય છે? (દા.ત. 2 અઠવાડિયા)";
  durationInput.value = r.duration;
  durationInput.addEventListener("input", () => {
    r.duration = durationInput.value;
    saveToSession();
  });
  statusBlock.appendChild(durationInput);

  card.appendChild(statusBlock);

  const nav = document.createElement("div");
  nav.className = "pager-nav";
  const backBtn = document.createElement("button");
  backBtn.type = "button";
  backBtn.className = "back-btn";
  backBtn.textContent = "← પાછળ";
  backBtn.disabled = currentIndex === 0;
  backBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderScenario();
    }
  });
  nav.appendChild(backBtn);
  if (currentIndex < ALL_SCENARIOS.length - 1) {
    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.id = "next-btn";
    nextBtn.className = "submit-btn next-section-btn";
    nextBtn.textContent = "આગળ →";
    nextBtn.disabled = !isComplete(r);
    nextBtn.addEventListener("click", () => {
      if (!isComplete(r)) return;
      currentIndex++;
      renderScenario();
    });
    nav.appendChild(nextBtn);
  }
  card.appendChild(nav);

  if (currentIndex === ALL_SCENARIOS.length - 1) {
    const reportRow = document.createElement("div");
    reportRow.className = "report-card-row";
    const reportBtn = document.createElement("button");
    reportBtn.type = "button";
    reportBtn.className = "report-card-btn";
    reportBtn.textContent = "રિપોર્ટ કાર્ડ મેળવો (PDF)";
    reportBtn.addEventListener("click", () => {
      saveToSession();
      window.location.href = "report-card.html?print=1";
    });
    reportRow.appendChild(reportBtn);
    card.appendChild(reportRow);
  }

  pager.appendChild(card);
  updateProgress();
}

function updateNav() {
  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) nextBtn.disabled = !isComplete(responses[currentIndex]);
  updateProgress();
}

function updateProgress() {
  const count = responses.filter(isComplete).length;
  const total = ALL_SCENARIOS.length;
  document.getElementById("progress-fill").style.width = `${(count / total) * 100}%`;
  document.getElementById("progress-label").textContent = `${count} / ${total} પ્રસંગ પૂરા`;
}

function saveToSession() {
  sessionStorage.setItem("section3Beliefs", JSON.stringify(responses));
}

document.getElementById("dev-fill-btn").addEventListener("click", () => {
  const sampleBeliefs = [
    "જો હું આ નહીં કરું તો stress નહીં જાય.",
    "આ એકલી ક્ષણ છે, કોઈ ફરક નથી પડતો.",
    "મને આનાથી વધારે સારું કંઈ નહીં મળે."
  ];
  responses.forEach(r => {
    r.belief = sampleBeliefs[Math.floor(Math.random() * sampleBeliefs.length)];
    r.statusIdx = Math.floor(Math.random() * STATUS_OPTIONS.length);
    r.duration = r.statusIdx === DURATION_OPTION_INDEX ? "2 અઠવાડિયા" : "";
    r.submitted = true;
  });
  saveToSession();
  renderScenario();
});

renderScenario();
</script>
</body>
</html>
